
<!DOCTYPE html>
<html>
<head>
    <title>Lista de precios</title>

    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: rgba(82, 19, 150, 0.55);
        }
    </style>
</head>

<body>

    <h1 style=color:skyblue>Precios de cafetería</h1>

    <table>
        <tr>
            <th style=color:red;background-color:skyblue; colspan="3">Desayunos</th>
        </tr>

        <tr>
            <th>Producto</th>
            <th>Tamaño</th>
            <th>Precio</th>
        </tr>

        <tr style=color:green;background-color:sandybrown>
            <td rowspan="2">Café</td>
            <td>Pequeño</td>
            <td>1,50 €</td>
        </tr>

        <tr>
            <td>Grande</td>
            <td>2,00 €</td>
        </tr>

        <tr style=color:fuchsia;background-color:purple; >
            <td>Colacao</td>
            <td>Grande</td>
            <td>2,20 €</td>
        </tr>

        <tr style=color:navajowhite;background-color:salmon; >
            <td>Tostada</td>
            <td>Normal</td>
            <td>2,50 €</td>
        </tr>

    </table>

</body>
</html>
