
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de usuario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Registro de usuario</h1>

    <form>
        <label for="usuario">Identificador de usuario:</label>
        <input type="text" id="usuario" value="usuario123" readonly>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" required>

        <label for="codigo">Código promocional:</label>
        <input type="text" id="codigo" disabled value="No disponible">

        <h2>Sexo</h2>

        <div class="opcion">
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino">Masculino</label>
        </div>

        <div class="opcion">
            <input type="radio" id="femenino" name="sexo" value="femenino">
            <label for="femenino">Femenino</label>
        </div>

        <h2>Aficiones</h2>

        <div class="opcion">
            <input type="checkbox" id="videojuegos" name="aficiones">
            <label for="videojuegos">Videojuegos</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="musica" name="aficiones">
            <label for="musica">Música</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="deporte" name="aficiones">
            <label for="deporte">Deporte</label>
        </div>

        <button type="submit">Registrarse</button>
    </form>

</body>
</html>
